name: Nix Build

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/nix-build.yml'
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Check flake
        run: nix flake check -L
