[workspace]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/networkmanager-rs/nmrs-gui"

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
nmrs = "3.0"
gtk = { version = "0.10.3", package = "gtk4" }
glib = "0.21"
dirs = "6.0.0"
fs2 = "0.4.3"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.18"
log = "0.4"

[package]
name = "nmrs-gui"
version = "1.5.1"
authors = ["Akrm Al-Hakimi <alhakimiakrmj@gmail.com>"]
edition.workspace = true
rust-version = "1.85.0"
description = "GTK4 GUI for managing NetworkManager connections"
license.workspace = true
repository.workspace = true
keywords = ["networkmanager", "gui", "gtk", "linux"]
categories = ["gui"]
publish = true

[lints]
workspace = true

[dependencies]
nmrs.workspace = true
gtk.workspace = true
glib.workspace = true
tokio.workspace = true
log.workspace = true
dirs.workspace = true
fs2.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio-util.workspace = true
