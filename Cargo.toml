[package]
name = "nmrs-gui"
version = "2.0.0"
authors = ["Akrm Al-Hakimi <alhakimiakrmj@gmail.com>"]
edition = "2024"
rust-version = "1.90.0"
description = "A NetworkManager client built on nmrs and gpui"
license = "MIT"
repository = "https://github.com/networkmanager-rs/nmrs-gui"
keywords = ["networkmanager", "gui", "gpui", "linux", "wifi"]
categories = ["gui"]
publish = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"
strip = true

[lints.rust]
unused = { level = "warn", priority = -1 }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
nmrs = "3.5.7"
dirs = "6.0.0"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time"] }
log = "0.4"
gpui-kit = "0.9.0"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1.0"
serde_json = "1"
